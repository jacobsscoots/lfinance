name: Fix PR18 Sonar issue

on:
  push:
    branches:
      - fix/sonar-maintainability-pass2
    paths:
      - .github/workflows/fix-pr18-sonar.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Remove duplicate case-insensitive character range
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/stepChangeParser.ts')
          s=p.read_text()
          old='([A-Za-z]+\\s+\\d{4})/i'
          new='([a-z]+\\s+\\d{4})/i'
          if old not in s:
              raise SystemExit('expected regex not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/stepChangeParser.ts
          git commit -m "fix: remove duplicate case-insensitive regex range"
          git push origin HEAD:fix/sonar-maintainability-pass2
