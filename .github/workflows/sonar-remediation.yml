name: Sonar remediation

on:
  push:
    branches:
      - fix/sonar-security-reliability-deps
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Apply source remediations
        run: |
          node .github/sonar-remediate.mjs
          node .github/sonar-postfix.mjs
      - name: Refresh vulnerable dependencies
        run: |
          npm install --save react-router-dom@7.18.3 pdfjs-dist@4.10.38
          npm install --save-dev postcss@8.5.26 vitest@3.2.7 vite@6.4.3 jsdom@30.0.1
          npm pkg set overrides.uuid=11.1.1
          npm install
          npm audit fix || true
      - name: Build
        run: npm run build
      - name: Run test suite for regression signal
        continue-on-error: true
        run: npm test -- --run
      - name: Require clean npm audit
        run: npm audit --audit-level=low
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: clear Sonar security reliability and dependency findings"
          git push origin HEAD:fix/sonar-security-reliability-deps
