name: Query Sonar PR19

on:
  push:
    branches:
      - fix/sonar-maintainability-pass3

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query PR issues
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          q=urllib.parse.urlencode({'componentKeys':'jacobsscoots_lfinance','pullRequest':'19','issueStatuses':'OPEN,CONFIRMED','ps':100})
          with urllib.request.urlopen('https://sonarcloud.io/api/issues/search?'+q, timeout=60) as r:
              d=json.load(r)
          for i in d.get('issues',[]):
              print(json.dumps({k:i.get(k) for k in ['key','rule','component','line','message','severity','textRange']}, ensure_ascii=False))
          print('TOTAL', d.get('paging',{}).get('total'))
          PY
