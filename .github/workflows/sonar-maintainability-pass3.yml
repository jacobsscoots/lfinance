name: Sonar maintainability pass 3

on:
  push:
    branches:
      - fix/sonar-maintainability-pass3
    paths:
      - .github/workflows/sonar-maintainability-pass3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - run: npm ci

      - name: Apply pass 3
        run: node .github/sonar-maint-pass3.mjs

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --audit-level=low

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: clear third batch of Sonar maintainability findings"
          git push origin HEAD:fix/sonar-maintainability-pass3
