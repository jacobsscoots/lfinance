name: Residual Sonar remediation

on:
  push:
    branches:
      - fix/sonar-residual-security-reliability-deps

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Apply residual source fixes
        run: node .github/sonar-residual-fix.mjs
      - name: Upgrade residual vulnerable transitive dependencies
        run: |
          npm pkg set overrides.browserslist=4.28.7
          npm pkg set overrides.postcss-selector-parser=6.1.3
          npm install
          npm ls browserslist postcss-selector-parser --all
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=low
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: clear residual Sonar reliability and dependency risks"
          git push origin HEAD:fix/sonar-residual-security-reliability-deps
