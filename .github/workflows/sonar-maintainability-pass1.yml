name: Sonar maintainability pass 1

on:
  push:
    branches:
      - fix/sonar-maintainability
    paths:
      - .github/workflows/sonar-maintainability-pass1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pass 1
        run: node .github/sonar-maint-pass1.mjs

      - name: Build
        run: npm run build

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: clear bulk Sonar maintainability findings"
          git push origin HEAD:fix/sonar-maintainability
