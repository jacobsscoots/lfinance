name: Fix PR19 Sonar issues

on:
  push:
    branches:
      - fix/sonar-maintainability-pass3

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - name: Replace regex alternations with character classes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('src/lib/nutritionExtraction.ts'),
              Path('supabase/functions/extract-nutrition/index.ts'),
          ]
          for path in paths:
              text = path.read_text()
              new = text.replace(r'(?:\(|\[)', r'[([]').replace(r'(?:\)|\])', r'[)\]]')
              if new == text:
                  print(f'No replacements needed in {path}')
              else:
                  path.write_text(new)
                  print(f'Updated {path}')
          PY
      - name: Build
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/nutritionExtraction.ts supabase/functions/extract-nutrition/index.ts
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: clear Sonar regex findings from pass 3"
          git push origin HEAD:fix/sonar-maintainability-pass3
