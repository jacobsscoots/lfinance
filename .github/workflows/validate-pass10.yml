name: Validate maintainability pass 10

on:
  push:
    branches:
      - fix/sonar-maintainability-pass10

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          path: baseline
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: fix/sonar-maintainability-pass10
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install baseline dependencies
        working-directory: baseline
        run: npm ci
      - name: Install candidate dependencies
        working-directory: candidate
        run: npm ci
      - name: Test baseline
        working-directory: baseline
        continue-on-error: true
        run: npm test -- --reporter=json --outputFile=vitest-results.json
      - name: Test candidate
        working-directory: candidate
        continue-on-error: true
        run: npm test -- --reporter=json --outputFile=vitest-results.json
      - name: Compare test failures
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          function failed(path) {
            if (!fs.existsSync(path)) return ['__NO_RESULTS_FILE__'];
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const names = [];
            for (const file of data.testResults || []) {
              for (const assertion of file.assertionResults || []) {
                if (assertion.status === 'failed') names.push(assertion.fullName || assertion.title || 'unknown');
              }
            }
            return names.sort();
          }
          const baseline = failed('baseline/vitest-results.json');
          const candidate = failed('candidate/vitest-results.json');
          console.log('Baseline failed tests:', baseline.length, baseline);
          console.log('Candidate failed tests:', candidate.length, candidate);
          if (JSON.stringify(baseline) !== JSON.stringify(candidate)) process.exit(1);
          NODE
      - name: Build candidate
        working-directory: candidate
        run: npm run build
